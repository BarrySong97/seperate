[package]
name = "workbench-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "workbench_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
pinyin = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
